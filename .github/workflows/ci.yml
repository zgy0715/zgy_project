name: DeepAgent CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Cancel superseded runs on the same ref instead of queueing them all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  # ========================
  # Vector Engine (C++)
  # ========================
  vector-engine-build:
    name: Vector Engine Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libpython3-dev python3-dev
          python3 -m pip install --upgrade pip pybind11
      - name: Configure CMake
        run: |
          cmake -S vector-engine -B vector-engine/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DVECTOR_ENGINE_BUILD_TESTS=ON
      - name: Build
        run: cmake --build vector-engine/build --parallel "$(nproc)"
      - name: Test
        run: ctest --test-dir vector-engine/build --output-on-failure
      - name: Verify the Python extension imports
        run: |
          # The pybind11 module must be importable by the exact name the Python
          # consumer uses (`import vector_engine`) — see app/services/vector_service.py.
          # Check the find result itself: `dirname ""` prints "." , so testing the
          # dirname would never detect a missing artifact.
          ENGINE_SO="$(find vector-engine/build -name 'vector_engine*.so' -print -quit)"
          if [ -z "$ENGINE_SO" ]; then
            echo "::error::the pybind11 module vector_engine*.so was not produced by the build"
            exit 1
          fi
          echo "extension: $ENGINE_SO"
          ENGINE_DIR="$(dirname "$ENGINE_SO")"
          PYTHONPATH="$ENGINE_DIR" python3 -c "import vector_engine; print(vector_engine.Engine)"

  # ========================
  # Agent Runtime (Python)
  # ========================
  agent-runtime-test:
    name: Agent Runtime Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-runtime
    env:
      # The service fails closed without an internal API key, so tests must supply
      # one. These values are throwaway and never used against a real provider.
      SECURITY_INTERNAL_API_KEY: ci-test-internal-key
      SECURITY_ALLOWED_DIRECTORIES: '["/tmp"]'
      LLM_OPENAI_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agent-runtime/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov
      - name: Lint with ruff
        run: ruff check app/
      - name: Type check with mypy
        run: mypy app/ --ignore-missing-imports
        continue-on-error: true  # advisory only — the codebase is not mypy-clean yet
      - name: Test with pytest
        run: pytest tests/ --ignore=tests/test_performance.py -v --cov=app --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: agent-runtime/coverage.xml
          fail_ci_if_error: false

  # ========================
  # API Gateway (Java)
  # ========================
  api-gateway-test:
    name: API Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build & Test with Maven
        run: |
          cd api-gateway
          # NOTE: this repository has no Maven Wrapper, so `./mvnw` does not exist.
          # Be tolerant in case one is added later.
          if [ -x "./mvnw" ]; then MVN="./mvnw"; else MVN="mvn"; fi
          "$MVN" -B verify
        env:
          # application-test.yml provides the datasource; tests run on H2.
          SPRING_PROFILES_ACTIVE: test
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: api-gateway/target/site/jacoco/jacoco.xml
          fail_ci_if_error: false

  # ========================
  # Frontend (TypeScript)
  # ========================
  frontend-test:
    name: Frontend Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
        env:
          # NEXT_PUBLIC_API_URL must include the /api/v1 suffix (api-client.ts:7
          # does not append it) and WS_URL is an http:// SockJS endpoint, not ws://.
          NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_WS_URL: http://localhost:8080/ws

  # ========================
  # Docker Build & Push
  # ========================
  docker-push:
    name: Build & Push Docker Images
    needs: [vector-engine-build, agent-runtime-test, api-gateway-test, frontend-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api-gateway, agent-runtime, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
            NEXT_PUBLIC_WS_URL=http://localhost:8080/ws
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
